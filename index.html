<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bootstrap Forms and Navbar</title>
    <style>
      .OBMC-CAMPUS {
        width: 100%;
        max-width: 800px;
        height: auto;
        border-radius: 12px;
        display: block;
      }
      
      body {
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBTFKaEQ30lyKukBw41KzNmkpROSuqguv8bEZYPEx4Wg&s=10);
        background-size: cover;
      }

      .image-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background-size: cover;
      }

    .form-group {
    display: flex;
    justify-content: center;
    background-color: white;
    align-items: center;
    margin: 0;
    min-height: 10vh;
    box-sizing: border-box;
      }

      
 
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Logo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Homepage</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>    
      </ul>
    </div>
  </div>
</nav>
</div>
  <form action="#" method="POST">

                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" placeholder="Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label for="email">Your School Email here:</label>
                    <input type="email" id="email" name="email" placeholder="your_email@gmail.com">
                </div>

                <div class="form-group">
                <label for="subject">Your Favorite Subjects here:</label>
                <input type="subject" id="subject" name="subject" placeholder="Eg: Social Studies, English"
                </div>

                <div class="form-group">
                  <label for="Message">Your Message to us here:</label>
                  <input type="message" id="message" name="message" placeholder="Type your message here..."
                  </div>

                 <div class="form-group">
                  <button type="send" class="send-btn">Send Reply</button>
                 </div>
</form>
</body>
</html>
